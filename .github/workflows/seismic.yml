name: Seismic CI

on:
  push:
    branches: [seismic]
  pull_request:
    branches: [seismic, usm]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    runs-on: large-github-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - name: sforge build
        run: cargo build --bin sforge
      - name: sanvil build
        run: cargo build --bin sanvil

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features
        # Not enforcing warnings here because there are too many to fix atm, but we may want to turn this back on.
        # env:
        #   RUSTFLAGS: -Dwarnings

  test:
    runs-on: large-github-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-cache"
      - name: Install ssolc
        run: |
          # Fetch the latest release asset ID
          ASSET_ID=$(curl -s https://api.github.com/repos/SeismicSystems/seismic-solidity/releases/latest | \
            jq -r '.assets[] | select(.name == "ssolc-linux-x86_64.tar.gz") | .id')
          # Download the asset
          curl -L -H "Accept: application/octet-stream" \
            -o ssolc.tar.gz \
            "https://api.github.com/repos/SeismicSystems/seismic-solidity/releases/assets/$ASSET_ID"
          # Extract - the binary is at solc/solc inside the archive
          tar -xzf ssolc.tar.gz
          sudo mv solc/solc /usr/local/bin/ssolc
          sudo chmod +x /usr/local/bin/ssolc
          ssolc --version
      # --- Seismic-specific tests ---
      - name: seismic unit tests
        run: cargo nextest run test_seismic_tx_encoding
      - name: seismic integration tests
        run: cargo nextest run test_seismic_
      - name: private storage tests
        run: cargo nextest run private_storage_

      # --- Unit tests for core crates (no external dependencies) ---
      - name: anvil-core unit tests
        run: cargo nextest run -p anvil-core
      - name: foundry-config unit tests
        run: cargo nextest run -p foundry-config

      # --- sanvil integration tests ---
      # Runs all non-fork, non-optimism anvil integration tests, excluding known
      # failures due to: hardcoded Mercury SpecId (pre-London tests), external RPC
      # dependencies, Seismic EVM behavior differences (timestamp, traces, blob txs),
      # and state deserialization needing #[serde(default)] in seismic-revm-inspectors.
      # See docs/test-audit.md for the full classification.
      - name: sanvil integration tests
        run: |
          cargo nextest run -p anvil --test it -E '
            not test(/fork|optimism|simulate/)
            & not test(=anvil::test_shanghai_fields)
            & not test(=anvil::test_anvil_recover_signature)
            & not test(=anvil_api::can_set_gas_price)
            & not test(=anvil_api::can_impersonate_gnosis_safe)
            & not test(=traces::test_trace_address_fork)
            & not test(=traces::test_trace_address_fork2)
            & not test(=api::can_get_code_by_hash)
            & not test(=eip4844::can_correctly_estimate_blob_gas_with_recommended_fillers_with_signer)
            & not test(=eip4844::can_get_blobs_by_tx_hash)
            & not test(=eip4844::can_mine_blobs_when_exceeds_max_blobs)
            & not test(=eip4844::cannot_exceed_six_blobs)
            & not test(=genesis::chain_id_precedence)
            & not test(=otterscan::test_call_ots_trace_transaction)
            & not test(=state::can_load_existing_state)
            & not test(=state::can_load_existing_state_legacy_stress)
            & not test(=state::test_backward_compatibility_state_dump_deserialization_v1_2)
            & not test(=transaction::can_send_tx_osaka_valid_with_limit_enabled)
            & not test(=transaction::test_reject_eip1559_pre_london)
          '

  viem:
    runs-on: large-github-runner
    timeout-minutes: 30
    env:
      SFOUNDRY_ROOT: /home/runner/work/seismic-foundry/seismic-foundry
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "viem-cache"
      - name: sanvil build
        run: cargo build --bin sanvil
      - name: Install dependencies
        run: bun install
      - name: Run viem tests vs. Anvil
        run: bun viem:test

  contract-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CODE_PATH: /home/ubuntu
      SFORGE_BINARY: /home/ubuntu/.seismic/bin/sforge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "contract-tests-cache"
      - name: Install JS dependencies
        run: bun install
      - name: Clean previous installations
        run: rm -rf $HOME/.seismic/bin/sforge || true
      - name: Install sforge binary
        run: |
          cargo install --root=$HOME/.seismic --profile dev --path ./crates/forge --locked
          echo "$HOME/.seismic/bin" >> $GITHUB_PATH
      - name: Verify sforge installation
        run: |
          ls -la $HOME/.seismic/bin/sforge
          $HOME/.seismic/bin/sforge --version || echo "sforge failed to run"
      - name: Run contract tests with sforge
        run: bun forge:test
