[package]
name = "anvil"
description = "Local ethereum node"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "sanvil"
path = "bin/main.rs"
required-features = ["cli"]

[dependencies]
# Seismic's added dependencies
seismic-crypto.workspace = true
seismic-prelude.workspace = true

# foundry internal
anvil-core = { path = "core" }
anvil-rpc = { path = "rpc" }
anvil-server = { path = "server" }
foundry-cli.workspace = true
foundry-common.workspace = true
foundry-config.workspace = true
foundry-evm.workspace = true
foundry-evm-core.workspace = true
# alloy
alloy-evm = { workspace = true, features = ["call-util"] }
alloy-op-evm.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-consensus = { workspace = true, features = ["k256", "kzg"] }
alloy-contract = { workspace = true, features = ["pubsub"] }
alloy-network.workspace = true
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-signer = { workspace = true, features = ["eip712"] }
alloy-signer-local = { workspace = true, features = ["mnemonic"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-dyn-abi = { workspace = true, features = ["std", "eip712"] }
alloy-rpc-types = { workspace = true, features = ["anvil", "trace", "txpool"] }
alloy-serde.workspace = true
alloy-provider = { workspace = true, features = [
    "reqwest",
    "ws",
    "ipc",
    "debug-api",
    "trace-api",
] }
alloy-transport.workspace = true
alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-trie.workspace = true
alloy-hardforks.workspace = true
alloy-op-hardforks.workspace = true
op-alloy-consensus = { workspace = true, features = ["serde"] }

# revm
revm = { workspace = true, features = [
    "std",
    "serde",
    "memory_limit",
    "c-kzg",
] }
revm-inspectors.workspace = true
op-revm.workspace = true

# axum related
axum.workspace = true
hyper.workspace = true

# tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# async
tokio = { workspace = true, features = ["time"] }
parking_lot.workspace = true
futures.workspace = true
async-trait.workspace = true

# misc
flate2.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
yansi.workspace = true
tempfile.workspace = true
itertools.workspace = true
rand_08.workspace = true
eyre.workspace = true

# cli
clap = { version = "4", features = [
    "derive",
    "env",
    "wrap_help",
], optional = true }
clap_complete = { workspace = true, optional = true }
chrono.workspace = true
ctrlc = { version = "3", optional = true }
fdlimit = { version = "0.3", optional = true }
clap_complete_fig = "4"

[dev-dependencies]
secp256k1 = { version = "0.30", default-features = false, features = [
    "global-context",
    "recovery",
] }

alloy-json-abi.workspace = true
alloy-rpc-client = { workspace = true, features = ["pubsub"] }
alloy-transport-ipc = { workspace = true, features = ["mock"] }
alloy-transport-ws.workspace = true
alloy-json-rpc.workspace = true
alloy-provider = { workspace = true, features = ["txpool-api", "reqwest"] }
alloy-pubsub.workspace = true
rand.workspace = true
foundry-test-utils.workspace = true
tokio = { workspace = true, features = ["full"] }
url = "2.5"
reqwest.workspace = true

[features]
default = ["cli", "jemalloc"]
asm-keccak = ["alloy-primitives/asm-keccak"]
jemalloc = ["foundry-cli/jemalloc"]
mimalloc = ["foundry-cli/mimalloc"]
tracy-allocator = ["foundry-cli/tracy-allocator"]
cli = ["tokio/full", "cmd"]
cmd = [
    "clap",
    "clap_complete",
    "dep:fdlimit",
    "dep:ctrlc",
    "anvil-server/clap",
    "tokio/signal",
]
## js-tracer feature was disabled in https://github.com/SeismicSystems/seismic-revm-inspectors/pull/40,
## such that even enabling it doesn't do anything. The intent was that we don't want js-tracer to be enabled by mistake
## on reth and cause privacy leakages. We might want to re-enable it for foundry though at one point if we think it's useful.
js-tracer = ["revm-inspectors/js-tracer"]
